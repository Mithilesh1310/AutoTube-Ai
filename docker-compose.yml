version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: autotube_postgres
    restart: always
    environment:
      POSTGRES_DB: autotube
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d autotube"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: autotube_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - APP_ENV=production
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword123@postgres:5432/autotube
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SECRET_KEY=${SECRET_KEY:-autotube-v1-production-secret-98765}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_TZpxlk94xSaidY}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-bMOb4tz31ZSsdLtUkYyySdx8}
      - YOUTUBE_CLIENT_ID=${YOUTUBE_CLIENT_ID}
      - YOUTUBE_CLIENT_SECRET=${YOUTUBE_CLIENT_SECRET}
      - YOUTUBE_REDIRECT_URI=${YOUTUBE_REDIRECT_URI:-http://localhost:8000/api/v1/youtube/callback}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - ANIMATION_PROVIDER=${ANIMATION_PROVIDER:-fal_ai}
      - ANIMATION_API_KEY=${ANIMATION_API_KEY}
      - BILLING_SANDBOX_MODE=false
    volumes:
      - autotube_storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: autotube_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=/api/v1
      - NEXT_PUBLIC_RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_TZpxlk94xSaidY}

  nginx:
    image: nginx:alpine
    container_name: autotube_nginx
    restart: always
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/ssl:/etc/ssl:ro
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot

volumes:
  postgres_data:
  autotube_storage:
  certbot_certs:
  certbot_www:
